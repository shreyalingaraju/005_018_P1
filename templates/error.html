{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block body %}
<div class="auth-wrap">
  <section class="auth-panel">
    <div class="card p-5 text-center" style="max-width:480px">
      <div class="display-4 fw-bold text-primary">{{ code }}</div>
      <h2 class="h5 fw-bold mt-2">{% if code == 403 %}Access denied{% elif code == 404 %}Page not found{% else %}Something went wrong{% endif %}</h2>
      <p class="text-muted">{{ message }}</p>
      <a href="/" class="btn btn-primary"><i class="bi bi-house me-1"></i>Go to my dashboard</a>
    </div>
  </section>
</div>
{% endblock %}
